<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Manager</title>
  <link rel="stylesheet" href = "{{ url_for('static', path='style.css')}}">
  <script src = "{{ url_for('static', path='script.js') }}" defer> </script>
</head>
<body>
  <h2>📚 Library Catalog</h2>
  
  <h3>Add a Book</h3>
  <form id="bookForm">
    <label>Title</label>
    <input type="text" id="title" required placeholder="e.g. The Hobbit">
    
    <label>Author</label>
    <input type="text" id="author" required placeholder="e.g. J.R.R. Tolkien">
    
    <label>Total Copies</label>
    <input type="number" id="copies" required min="1" value="1">
    
    <button type="submit">Submit Book</button>
  </form>

  <h3>Available Books</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Available / Total</th>
      </tr>
    </thead>
    <tbody id="booksTableBody"></tbody>
  </table>

</body>
</html>
