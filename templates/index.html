<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Manager</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <script src = "{{ url_for('static', path='script.js') }}" defer> </script>
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 700px;">
    <h2 class="mb-4">📚 Library Catalog</h2>

    <!-- Add Book Card -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Add a Book</h5>
        <form id="bookForm">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control" required placeholder="e.g. The Hobbit">
          </div>
          
          <div class="mb-3">
            <label class="form-label">Author</label>
            <input type="text" id="author" class="form-control" required placeholder="e.g. J.R.R. Tolkien">
          </div>

          <div class="mb-3">
            <label class="form-label">Total Copies</label>
            <input type="number" id="copies" class="form-control" required min="1" value="1">
          </div>

          <button type="submit" class="btn btn-primary">Submit Book</button>
        </form>
      </div>
    </div>

    <!-- Available Books Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Available Books</h5>
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-secondary">
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Copies (Avail / Total)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="booksTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
