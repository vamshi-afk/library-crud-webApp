<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="{{ url_for('static', path='script.js') }}" defer></script>
</head>
<body class="bg-light">

  <div class="container my-5" style="max-width: 850px;">
    <h2 class="mb-4">📚 Library Manager</h2>

    <!-- Navigation Tabs -->
    <ul class="nav nav-tabs mb-4" id="libraryTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="books-tab" data-bs-toggle="tab" data-bs-target="#books-pane" type="button" role="tab">Books</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="members-tab" data-bs-toggle="tab" data-bs-target="#members-pane" type="button" role="tab">Members</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="borrow-tab" data-bs-toggle="tab" data-bs-target="#borrow-pane" type="button" role="tab">Borrow & Loans</button>
      </li>
    </ul>

    <div class="tab-content" id="libraryTabContent">

      <!-- ==================== TAB 1: BOOKS ==================== -->
      <div class="tab-pane fade show active" id="books-pane" role="tabpanel">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Add a Book</h5>
            <form id="bookForm" class="row g-3">
              <div class="col-md-5">
                <label class="form-label">Title</label>
                <input type="text" id="title" class="form-control" required placeholder="e.g. The Hobbit">
              </div>
              <div class="col-md-4">
                <label class="form-label">Author</label>
                <input type="text" id="author" class="form-control" required placeholder="e.g. J.R.R. Tolkien">
              </div>
              <div class="col-md-3">
                <label class="form-label">Total Copies</label>
                <input type="number" id="copies" class="form-control" required min="1" value="1">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Submit Book</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Catalog</h5>
            <div class="table-responsive">
              <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                  <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Copies (Avail / Total)</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="booksTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== TAB 2: MEMBERS ==================== -->
      <div class="tab-pane fade" id="members-pane" role="tabpanel">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Register Member</h5>
            <form id="memberForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" id="memberName" class="form-control" required placeholder="e.g. Alice">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="memberEmail" class="form-control" required placeholder="e.g. alice@example.com">
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Add Member</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Registered Members</h5>
            <div class="table-responsive">
              <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="membersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== TAB 3: BORROW & LOANS ==================== -->
      <div class="tab-pane fade" id="borrow-pane" role="tabpanel">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Issue a Book</h5>
            <form id="borrowForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Select Book</label>
                <select id="borrowBookSelect" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Select Member</label>
                <select id="borrowMemberSelect" class="form-select" required></select>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-success">Checkout Book</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">Borrow Records</h5>
            <div class="table-responsive">
              <table class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-secondary">
                  <tr>
                    <th>Record ID</th>
                    <th>Book ID</th>
                    <th>Member ID</th>
                    <th>Borrowed At</th>
                    <th>Status / Action</th>
                  </tr>
                </thead>
                <tbody id="loansTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
